<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#0b1220" />
<title>이안 상담DB · 계약관리</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#0f1a2e; --panel:#16233c; --panel2:#1f3050; --line:#2b3d5e;
    --txt:#eef4ff; --muted:#93a4c4; --dim:#6b7c9c;
    --accent:#4dabf7; --accent2:#1c7ed6;
    --ok:#2fbf71; --warn:#f0a020; --danger:#ff5c5c; --gold:#ffcf5c;
    --purple:#b085f5; --blue:#5b9bff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
    background:linear-gradient(180deg,#0b1220,#0d1526 60%); color:var(--txt); font-size:15px;
    -webkit-text-size-adjust:100%; padding-bottom:90px; line-height:1.45;}
  header{position:sticky;top:0;z-index:30;background:rgba(11,18,32,.94);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:11px 14px 0;}
  .brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
  .brand .l{display:flex;align-items:baseline;gap:8px}
  .brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.4px}
  .brand h1 span{color:var(--accent)}
  .brand .sub{font-size:12px;color:var(--dim)}
  .hbtns{display:flex;gap:6px}
  .btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;font-size:14px;cursor:pointer;font-weight:600;white-space:nowrap}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 10px;font-size:13px}
  .btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}
  .cloud-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);display:inline-block;margin-right:5px;vertical-align:middle}
  .cloud-dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
  /* stat strip */
  .catswitch{display:flex;gap:6px;margin:10px 0 2px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px}
  .cat{flex:1;text-align:center;padding:9px;border-radius:9px;font-weight:800;cursor:pointer;color:var(--muted);font-size:14.5px}
  .cat.active[data-cat="사업용"]{background:var(--accent2);color:#fff}
  .cat.active[data-cat="가정용"]{background:#2f8f5b;color:#fff}
  .statstrip{display:flex;gap:8px;margin:9px 0 10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .st{flex:1;min-width:82px;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);
    border-radius:12px;padding:9px 12px}
  .st .n{font-size:19px;font-weight:800;letter-spacing:-.3px}
  .st .n.gold{color:var(--gold)} .st .n.ok{color:var(--ok)}
  .st .l{font-size:11px;color:var(--muted);margin-top:1px}
  .tabs{display:flex;gap:6px;padding-bottom:11px}
  .tab{flex:1;text-align:center;padding:10px;border-radius:11px;background:var(--panel);border:1px solid var(--line);
    font-weight:700;cursor:pointer;color:var(--muted);font-size:14px}
  .tab.active{background:var(--accent2);color:#fff;border-color:var(--accent2)}
  .wrap{padding:12px 14px;max-width:920px;margin:0 auto}
  /* followup alert */
  .alertbox{background:linear-gradient(180deg,#2a1520,#1a1018);border:1px solid #5a2740;border-radius:14px;
    padding:12px 13px;margin-bottom:13px}
  .alertbox h3{margin:0 0 9px;font-size:14px;color:#ff9db0}
  .al-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid rgba(255,255,255,.06)}
  .al-item:first-of-type{border-top:none}
  .al-badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:#5a2740;color:#ffb3c1;white-space:nowrap}
  .al-badge.over{background:var(--danger);color:#fff}
  .al-name{font-weight:700}
  .al-item a{margin-left:auto;color:var(--accent);text-decoration:none;font-weight:600;font-size:14px}
  /* quick */
  .quick{display:flex;gap:8px;margin-bottom:11px}
  .quick input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;color:var(--txt);font-size:15px}
  .quick input::placeholder{color:var(--dim)}
  /* chips */
  .chips{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:3px;margin-bottom:10px}
  .chip{white-space:nowrap;padding:8px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
    color:var(--muted);font-weight:700;font-size:13px;cursor:pointer}
  .chip .c{opacity:.7;margin-left:4px;font-weight:800}
  .chip.active{background:#13233f;border-color:var(--accent);color:var(--accent)}
  .toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .toolbar input.search{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 13px;color:var(--txt);font-size:14px}
  select{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px;color:var(--txt);font-size:14px}
  /* list */
  .list{display:flex;flex-direction:column;gap:10px}
  .card{background:linear-gradient(180deg,var(--panel),#13203a);border:1px solid var(--line);border-radius:15px;
    padding:13px 14px;position:relative}
  .card.contract{border-left:3px solid var(--ok)}
  .card .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .card .name{font-weight:800;font-size:17px;letter-spacing:-.3px}
  .card .phone{color:var(--accent);font-size:15px;text-decoration:none;font-weight:600}
  .badge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .b-상담예정{background:#33445e;color:#cdd9ec}
  .b-1차상담{background:#123a5a;color:#7cc4ff}
  .b-2차상담{background:#3a2c5e;color:#c9b3ff}
  .b-계약{background:#123f2b;color:#7fe0a8}
  .b-종료{background:#232f42;color:#7c8aa3}
  .card .addr{color:var(--muted);font-size:13.5px;margin-top:7px;display:flex;gap:5px}
  .card .addr .pin{color:var(--danger);flex:none}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .tag{font-size:12px;font-weight:700;padding:4px 9px;border-radius:7px;background:var(--panel2);color:var(--muted)}
  .tag.kw{background:#12243f;color:#9cc7ff}
  .tag.rps{background:#3a3110;color:var(--gold)}
  .tag.임대{background:#0e3040;color:#7fd6ff}
  .tag.현금{background:#123320;color:#87e6a6}
  .tag.who{background:#241a3a;color:#c3aef5}
  .tag.company{background:#0d2f2a;color:#6fe6c8;font-weight:800}
  .tag.area{background:#2a2620;color:#e6c99a}
  .amt{font-weight:800;color:var(--gold);font-size:15px;margin-left:auto}
  .cdate{font-size:12px;color:var(--ok);font-weight:700}
  .special{margin-top:8px;font-size:13px;color:#ffd0a8;background:#2a1e12;border-radius:9px;padding:7px 10px}
  .note{margin-top:7px;font-size:13px;color:#cfdbf0;background:#0e1a30;border-radius:9px;padding:8px 10px;white-space:pre-wrap}
  .row-actions{display:flex;gap:7px;margin-top:10px}
  .meta{font-size:11.5px;color:var(--dim);margin-top:9px;display:flex;gap:10px;flex-wrap:wrap}
  .empty{text-align:center;color:var(--muted);padding:44px 10px}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px;max-height:93vh;overflow:auto;border:1px solid var(--line);border-bottom:none}
  @media(min-width:560px){.modal-bg{align-items:center}.modal{border-radius:20px;border-bottom:1px solid var(--line)}}
  .modal h3{margin:0 0 13px;font-size:17px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.full{grid-column:1/-1}
  .field label{font-size:12px;color:var(--muted);font-weight:600}
  .field input,.field select,.field textarea{background:var(--bg2);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;color:var(--txt);font-size:15px;font-family:inherit}
  .field textarea{min-height:72px;resize:vertical}
  .modal-actions{display:flex;gap:8px;margin-top:17px}
  .modal-actions .btn{flex:1;padding:13px}
  .hint{font-size:12px;color:var(--muted);line-height:1.6}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#06101f;border:1px solid var(--line);
    color:var(--txt);padding:12px 20px;border-radius:12px;z-index:80;opacity:0;transition:.25s;pointer-events:none;font-weight:700;font-size:14px}
  .toast.show{opacity:1}
  code{background:var(--panel2);padding:2px 5px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="l"><h1>이안 <span>상담DB</span></h1><span class="sub">이안태양광</span></div>
    <div class="hbtns">
      <button class="btn sm ghost" id="btnCloud"><span class="cloud-dot" id="cloudDot"></span>동기화</button>
      <button class="btn sm ghost" id="btnMenu">⋯</button>
    </div>
  </div>
  <div class="catswitch" id="catswitch">
    <div class="cat active" data-cat="사업용">🏢 사업용</div>
    <div class="cat" data-cat="가정용">🏠 가정용 (3~9kW)</div>
  </div>
  <div class="statstrip" id="stats"></div>
  <div class="tabs">
    <div class="tab active" data-view="db">📋 상담DB</div>
    <div class="tab" data-view="contract">✅ 계약현황</div>
  </div>
</header>

<div class="wrap">
  <div class="alertbox" id="alertbox" style="display:none"></div>

  <div class="quick">
    <input id="quickInput" placeholder="빠른입력: 홍길동 01012345678 대전 30kw 임대 협력 …" />
    <button class="btn primary" id="quickAdd">추가</button>
  </div>

  <div class="chips" id="chips"></div>

  <div class="toolbar">
    <input class="search" id="search" placeholder="🔍 이름·전화·주소·메모·누구디비 검색" />
    <select id="sort">
      <option value="updated">최근순</option>
      <option value="name">이름순</option>
      <option value="amount">금액순</option>
    </select>
    <select id="companyFilter" style="flex:1;min-width:130px"><option value="">🏢 전체 회사</option></select>
  </div>

  <div class="list" id="list"></div>
</div>

<!-- 편집 -->
<div class="modal-bg" id="editBg">
  <div class="modal">
    <h3 id="editTitle">상담 추가</h3>
    <div class="fgrid">
      <div class="field"><label>구분</label>
        <select id="f_category"><option>사업용</option><option>가정용</option></select>
      </div>
      <div class="field"><label>이름</label><input id="f_name"/></div>
      <div class="field"><label>연락처</label><input id="f_phone" inputmode="numeric"/></div>
      <div class="field"><label>진행단계</label>
        <select id="f_stage"><option>상담예정</option><option>1차상담</option><option>2차상담</option><option>계약</option><option>종료</option></select>
      </div>
      <div class="field"><label>누구디비</label><input id="f_source" placeholder="자체 민경민 / 협력 / 조재현"/></div>
      <div class="field"><label>계약회사</label><input id="f_company" placeholder="예: OO에너지 / OO발전"/></div>
      <div class="field"><label>용량(kW)</label><input id="f_kw" inputmode="decimal"/></div>
      <div class="field"><label>유형</label>
        <select id="f_type"><option value="">-</option><option>임대</option><option>RPS</option><option>현금</option></select>
      </div>
      <div class="field"><label>계약금액</label><input id="f_amount" placeholder="6,750만 / 2.2억"/></div>
      <div class="field"><label>평수/면적</label><input id="f_area" placeholder="250평 / 60평 미만"/></div>
      <div class="field full"><label>주소</label><input id="f_addr"/></div>
      <div class="field"><label>영업담당</label><input id="f_rep"/></div>
      <div class="field"><label>다음연락일</label><input id="f_followup" type="date"/></div>
      <div class="field full"><label>특이사항</label><input id="f_special"/></div>
      <div class="field full"><label>메모 (비고)</label><textarea id="f_note"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn danger" id="btnDelete" style="flex:0 0 auto">삭제</button>
      <button class="btn ghost" id="btnCancel">취소</button>
      <button class="btn primary" id="btnSave">저장</button>
    </div>
  </div>
</div>

<!-- 메뉴 -->
<div class="modal-bg" id="menuBg">
  <div class="modal">
    <h3>메뉴 / 백업</h3>
    <div style="display:flex;flex-direction:column;gap:9px">
      <button class="btn" id="mSync">🔄 지금 클라우드에서 새로고침</button>
      <button class="btn" id="mExport">💾 JSON 백업 내보내기</button>
      <button class="btn" id="mImport">📂 JSON 불러오기 (병합)</button>
      <input type="file" id="fileImport" accept="application/json" style="display:none"/>
      <button class="btn" id="mCsv">📊 CSV 내보내기 (엑셀)</button>
      <button class="btn danger" id="mReset">🗑 이 기기 목록 비우기</button>
    </div>
    <p class="hint" style="margin-top:14px">데이터는 이 브라우저 + (연결 시) 클라우드에 저장됩니다. "비우기"는 이 기기 화면만 지우며, 다시 동기화하면 클라우드에서 내려받습니다.</p>
    <div class="modal-actions"><button class="btn ghost" id="menuClose" style="flex:1">닫기</button></div>
  </div>
</div>

<!-- 클라우드 -->
<div class="modal-bg" id="cloudBg">
  <div class="modal">
    <h3>☁ 클라우드 동기화 (Supabase)</h3>
    <p class="hint">PC·폰에서 <b>같은 데이터</b>를 보려면 Supabase 정보를 입력하세요. 이 앱은 봇과 분리된 전용 테이블 <code>sangdam_db</code> 만 사용합니다.</p>
    <div class="fgrid" style="margin-top:10px">
      <div class="field full"><label>Supabase URL</label><input id="c_url" placeholder="https://xxxx.supabase.co"/></div>
      <div class="field full"><label>API Key (anon)</label><input id="c_key" placeholder="eyJ..."/></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="cloudOff">동기화 끄기</button>
      <button class="btn primary" id="cloudSave">연결 & 동기화</button>
    </div>
    <p class="hint" id="cloudStatus" style="margin-top:10px"></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const LS_KEY="ianDB_v1", LS_CLOUD="ianDB_cloud_v1";
const STAGES=["상담예정","1차상담","2차상담","계약","종료"];
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now=()=>new Date().toISOString();
const today=()=>new Date().toISOString().slice(0,10);

let state={ view:"db", data:[], editingId:null, stageFilter:"", category:"사업용" };
let cloud={ url:"", key:"", on:false };

/* storage */
function loadLocal(){ try{state.data=JSON.parse(localStorage.getItem(LS_KEY)||"[]")}catch(e){state.data=[]} }
function saveLocal(){ localStorage.setItem(LS_KEY, JSON.stringify(state.data)); }
function loadCloudCfg(){ try{cloud=Object.assign(cloud,JSON.parse(localStorage.getItem(LS_CLOUD)||"{}"))}catch(e){} }
function saveCloudCfg(){ localStorage.setItem(LS_CLOUD, JSON.stringify(cloud)); }

/* Supabase REST — 전용 테이블 sangdam_db */
function sbHeaders(){ return {apikey:cloud.key,Authorization:"Bearer "+cloud.key,"Content-Type":"application/json"}; }
async function cloudPull(){
  if(!cloud.on) return;
  const r=await fetch(`${cloud.url}/rest/v1/sangdam_db?select=*&order=updated_at.desc`,{headers:sbHeaders()});
  if(!r.ok) throw new Error("pull "+r.status);
  const rows=await r.json();
  const byRemote={}; state.data.forEach(d=>{ if(d.remote_id) byRemote[d.remote_id]=d; });
  rows.forEach(row=>{
    const rec=fromRemote(row); const ex=byRemote[row.id];
    if(ex){ Object.assign(ex,rec,{id:ex.id,remote_id:row.id}); }
    else { state.data.push(Object.assign(rec,{id:uid(),remote_id:row.id})); }
  });
  // 서버에서 삭제된 항목은 이 기기에서도 제거 (예전 찌꺼기 자동청소).
  // remote_id가 있는데 서버 목록에 없으면 = 삭제된 것. 아직 안 올린(remote_id 없는) 새 항목은 유지.
  const serverIds=new Set(rows.map(x=>x.id));
  state.data=state.data.filter(d=>!d.remote_id || serverIds.has(d.remote_id));
  saveLocal();
}
async function cloudPush(rec){
  if(!cloud.on) return;
  const body=toRemote(rec);
  try{
    if(rec.remote_id){
      await fetch(`${cloud.url}/rest/v1/sangdam_db?id=eq.${rec.remote_id}`,{method:"PATCH",headers:sbHeaders(),body:JSON.stringify(body)});
    }else{
      const r=await fetch(`${cloud.url}/rest/v1/sangdam_db`,{method:"POST",headers:Object.assign(sbHeaders(),{Prefer:"return=representation"}),body:JSON.stringify(body)});
      if(r.ok){ const j=await r.json(); if(j&&j[0]&&j[0].id){ rec.remote_id=j[0].id; saveLocal(); } }
    }
  }catch(e){ console.warn("push fail",e); }
}
async function cloudDelete(rec){
  if(!cloud.on||!rec.remote_id) return;
  try{ await fetch(`${cloud.url}/rest/v1/sangdam_db?id=eq.${rec.remote_id}`,{method:"DELETE",headers:sbHeaders()}); }catch(e){}
}
const REMOTE_FIELDS=["name","phone","addr","area","kw","type","amount","stage","rep","source","company","note","special","followup","category","created_at","updated_at"];
function toRemote(r){ const o={}; REMOTE_FIELDS.forEach(f=>{ o[f]=r[f]||null; }); return o; }
function fromRemote(row){
  const o={}; REMOTE_FIELDS.forEach(f=>o[f]=row[f]||"");
  if(!o.stage) o.stage="상담예정";
  if(!o.category) o.category="사업용";
  if(!o.created_at) o.created_at=now(); if(!o.updated_at) o.updated_at=now();
  return o;
}

/* quick parse */
function parseQuick(text){
  const rec={name:"",phone:"",kw:"",type:"",amount:"",stage:"",addr:"",source:"",area:"",special:"",note:"",category:""};
  let t=" "+text.trim()+" ";
  const ph=t.match(/01[016789][\s\-]?\d{3,4}[\s\-]?\d{4}/);
  if(ph){ rec.phone=ph[0].replace(/\s/g,""); t=t.replace(ph[0]," "); }
  const kw=t.match(/(\d+(?:\.\d+)?)\s*(?:kw|kW|KW|키로|킬로|㎾)/);
  if(kw){ rec.kw=kw[1]; t=t.replace(kw[0]," "); }
  const eok=t.match(/(\d+(?:\.\d+)?)\s*억/); const man=t.match(/([\d,]+)\s*만/);
  if(eok||man){ rec.amount=(eok?eok[1]+"억":"")+(man?man[1].replace(/,/g,"")+"만":""); if(eok)t=t.replace(eok[0]," "); if(man)t=t.replace(man[0]," "); }
  const area=t.match(/(\d+\s*[~-]\s*\d+\s*평|\d+\s*평(?:\s*미만|\s*이상)?|\d+\s*㎡)/);
  if(area){ rec.area=area[0].replace(/\s/g,""); t=t.replace(area[0]," "); }
  if(/임대/.test(t)){rec.type="임대";t=t.replace(/임대/g," ");}
  else if(/rps/i.test(t)){rec.type="RPS";t=t.replace(/rps/ig," ");}
  else if(/현금|자부담/.test(t)){rec.type="현금";t=t.replace(/현금|자부담/g," ");}
  if(/민경민/.test(t)){rec.source="자체 민경민";t=t.replace(/자체\s*민경민|민경민/g," ");}
  else if(/협력/.test(t)){rec.source="협력";t=t.replace(/협력/g," ");}
  else if(/조재현|조재/.test(t)){rec.source="조재현";t=t.replace(/조재현|조재/g," ");}
  else if(/자체/.test(t)){rec.source="자체";t=t.replace(/자체/g," ");}
  for(const s of STAGES){ if(t.includes(s)){rec.stage=s;t=t.replace(s," ");break;} }
  ["목조","평수작음","연락안됨","부재","선로없음","불법건축물"].forEach(k=>{ if(t.includes(k)){ rec.special=(rec.special?rec.special+" ":"")+k; t=t.replace(new RegExp(k,"g")," "); } });
  const nm=t.trim().match(/[가-힣]{2,4}(?:님|소장)?/);
  if(nm){ rec.name=nm[0]; t=t.replace(nm[0]," "); }
  const rest=t.replace(/\s+/g," ").trim(); if(rest) rec.note=rest;
  if(/가정용|주택|단독주택|자가/.test(t)){ rec.category="가정용"; }
  if(!rec.category && rec.kw){ const n=parseFloat(rec.kw); if(n>0&&n<=10) rec.category="가정용"; }
  if(!rec.stage) rec.stage = ["임대","RPS","현금"].includes(rec.type) ? "계약" : "상담예정";
  return rec;
}

/* CRUD */
function addRecord(rec){ const r=Object.assign({id:uid(),created_at:now(),updated_at:now(),stage:"상담예정"},rec); if(!r.category) r.category=state.category; state.data.unshift(r); saveLocal(); cloudPush(r); return r; }
function updateRecord(id,patch){ const r=state.data.find(x=>x.id===id); if(!r)return; Object.assign(r,patch,{updated_at:now()}); saveLocal(); cloudPush(r); }
function deleteRecord(id){ const i=state.data.findIndex(x=>x.id===id); if(i<0)return; const r=state.data[i]; state.data.splice(i,1); saveLocal(); cloudDelete(r); }

/* amount */
function amtToMan(s){ if(!s)return 0; let m=0; const e=(""+s).match(/(\d+(?:\.\d+)?)\s*억/); const w=(""+s).match(/([\d,]+)\s*만/); if(e)m+=parseFloat(e[1])*10000; if(w)m+=parseFloat(w[1].replace(/,/g,"")); return m; }
function fmtMan(n){ if(!n)return "0"; if(n>=10000){ const e=n/10000; return (Number.isInteger(e)?e:e.toFixed(1))+"억"; } return n.toLocaleString()+"만"; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
function extractCdate(note){ const m=(note||"").match(/계약일\s*(\d{4}-\d{2}-\d{2})/); return m?m[1]:""; }
function fmtDay(s){ if(!s) return "-"; const d=new Date(s); if(isNaN(d)) return String(s).slice(0,10); const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function fmtDayTime(s){ if(!s) return "-"; const d=new Date(s); if(isNaN(d)) return String(s).slice(0,10); const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function gcalUrl(r){
  const d=(r.followup||"").replace(/-/g,""); if(d.length!==8) return "";
  const start=d+"T090000", end=d+"T093000";
  const det=[r.phone?"📞 "+r.phone:"", r.addr?"📍 "+r.addr:"", r.source?"누구디비: "+r.source:"", r.note?"메모: "+r.note:"", "— 이안 상담DB"].filter(Boolean).join("\n");
  const u=new URL("https://calendar.google.com/calendar/render");
  u.searchParams.set("action","TEMPLATE");
  u.searchParams.set("text","📞 "+(r.name||"상담")+" 연락");
  u.searchParams.set("dates",start+"/"+end);
  u.searchParams.set("ctz","Asia/Seoul");
  u.searchParams.set("details",det);
  if(r.addr) u.searchParams.set("location",r.addr);
  return u.toString();
}

/* render */
function inCat(r){ return (r.category||"사업용")===state.category; }
function currentList(){
  let arr=state.data.filter(inCat);
  if(state.view==="contract") arr=arr.filter(r=>r.stage==="계약");
  if(state.stageFilter) arr=arr.filter(r=>r.stage===state.stageFilter);
  const comp=$("#companyFilter").value;
  if(comp) arr=arr.filter(r=>r.company===comp);
  const q=$("#search").value.trim();
  if(q){ const k=q.toLowerCase(); arr=arr.filter(r=>[r.name,r.phone,r.addr,r.note,r.source,r.company,r.special,r.rep,r.area].join(" ").toLowerCase().includes(k)); }
  const sort=$("#sort").value;
  arr.sort((a,b)=>{
    if(sort==="name") return (a.name||"").localeCompare(b.name||"","ko");
    if(sort==="amount") return amtToMan(b.amount)-amtToMan(a.amount);
    return (b.updated_at||"").localeCompare(a.updated_at||"");
  });
  return arr;
}
function renderStats(){
  const d=state.data.filter(inCat), contracts=d.filter(r=>r.stage==="계약");
  const total=contracts.reduce((s,r)=>s+amtToMan(r.amount),0);
  const cards = state.view==="contract"
    ? [["계약 건수",contracts.length+"건",""],["계약금액",fmtMan(total),"gold"],["임대",contracts.filter(r=>r.type==="임대").length+"건",""],["RPS",contracts.filter(r=>r.type==="RPS").length+"건",""],["현금",contracts.filter(r=>r.type==="현금").length+"건",""]]
    : [["전체",d.length+"건",""],["상담예정",d.filter(r=>r.stage==="상담예정").length+"건",""],["진행중",d.filter(r=>["1차상담","2차상담"].includes(r.stage)).length+"건",""],["계약",contracts.length+"건","ok"],["계약금액",fmtMan(total),"gold"]];
  $("#stats").innerHTML=cards.map(c=>`<div class="st"><div class="n ${c[2]}">${c[1]}</div><div class="l">${c[0]}</div></div>`).join("");
}
function renderChips(){
  const d=state.data.filter(inCat);
  const base = state.view==="contract" ? d.filter(r=>r.stage==="계약") : d;
  const counts={};STAGES.forEach(s=>counts[s]=d.filter(r=>r.stage===s).length);
  let chips=[["","전체",base.length]];
  if(state.view==="db") STAGES.forEach(s=>chips.push([s,s,counts[s]]));
  $("#chips").style.display = state.view==="db" ? "flex":"none";
  $("#chips").innerHTML=chips.map(c=>`<div class="chip ${state.stageFilter===c[0]?'active':''}" data-stage="${esc(c[0])}">${esc(c[1])}<span class="c">${c[2]}</span></div>`).join("");
}
function renderAlert(){
  const t=today();
  const due=state.data.filter(r=>inCat(r) && r.followup && r.followup<=t && r.stage!=="종료")
    .sort((a,b)=>(a.followup||"").localeCompare(b.followup||""));
  const box=$("#alertbox");
  if(!due.length){ box.style.display="none"; return; }
  box.style.display="block";
  box.innerHTML=`<h3>🔔 오늘 연락할 곳 · ${due.length}건</h3>`+due.map(r=>{
    const over=r.followup<t; const dd=Math.round((new Date(t)-new Date(r.followup))/86400000);
    return `<div class="al-item"><span class="al-badge ${over?'over':''}">${over?dd+'일 지남':'오늘'}</span>
      <span class="al-name">${esc(r.name||'-')}</span>
      ${r.phone?`<a href="tel:${esc(r.phone)}">📞 ${esc(r.phone)}</a>`:''}</div>`;
  }).join("");
}
function renderList(){
  const arr=currentList();
  if(!arr.length){ $("#list").innerHTML=`<div class="empty">데이터가 없습니다.<br>위 빠른입력칸에 한 줄 쳐보세요.</div>`; return; }
  $("#list").innerHTML=arr.map(r=>{
    const isC=r.stage==="계약";
    const kw=r.kw?`<span class="tag kw">${esc(r.kw)}kW</span>`:"";
    const type=r.type?`<span class="tag ${r.type==='RPS'?'rps':r.type}">${esc(r.type)}</span>`:"";
    const who=r.source?`<span class="tag who">${esc(r.source)}</span>`:"";
    const comp=r.company?`<span class="tag company">🏢 ${esc(r.company)}</span>`:"";
    const area=r.area?`<span class="tag area">${esc(r.area)}</span>`:"";
    const amt=r.amount?`<span class="amt">${esc(r.amount)}</span>`:"";
    const cdate=extractCdate(r.note);
    return `<div class="card ${isC?'contract':''}" data-id="${r.id}">
      <div class="top">
        <span class="name">${esc(r.name||"(이름없음)")}</span>
        ${r.phone?`<a class="phone" href="tel:${esc(r.phone)}">${esc(r.phone)}</a>`:""}
        <span style="flex:1"></span>
        ${r.followup?`<span class="cdate" style="color:var(--warn)">⏰${esc(r.followup)}</span>`:""}
        ${cdate?`<span class="cdate">📅${esc(cdate)}</span>`:""}
        <span class="badge b-${esc(r.stage)}">${esc(r.stage)}</span>
      </div>
      ${r.addr?`<div class="addr"><span class="pin">📍</span><span>${esc(r.addr)}</span></div>`:""}
      <div class="tags">${comp}${kw}${type}${area}${who}${amt}</div>
      ${r.special?`<div class="special">⚑ ${esc(r.special)}</div>`:""}
      ${r.note?`<div class="note">${esc(r.note)}</div>`:""}
      <div class="meta"><span>🗓 등록 ${fmtDay(r.created_at)}</span><span>✏️ 수정 ${fmtDayTime(r.updated_at)}</span></div>
      <div class="row-actions">
        <button class="btn sm" data-edit="${r.id}">수정</button>
        ${isC?`<button class="btn sm" data-stage="${r.id}">단계변경</button>`:`<button class="btn sm" data-contract="${r.id}">계약전환</button>`}
        ${r.followup?`<button class="btn sm" data-alarm="${r.id}" style="color:var(--gold)">📅 알람등록</button>`:""}
      </div>
    </div>`;
  }).join("");
}
function renderCompanyFilter(){
  const sel=$("#companyFilter"); if(!sel) return; const cur=sel.value;
  const comps=[...new Set(state.data.filter(inCat).map(r=>r.company).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ko"));
  sel.innerHTML='<option value="">🏢 전체 회사</option>'+comps.map(c=>`<option${c===cur?" selected":""}>${esc(c)}</option>`).join("");
}
function render(){ renderStats(); renderChips(); renderCompanyFilter(); renderAlert(); renderList(); }

/* modal */
function openEdit(id){
  state.editingId=id;
  const r=id?state.data.find(x=>x.id===id):{stage:"상담예정",category:state.category};
  $("#editTitle").textContent=id?"상담 수정":"상담 추가";
  $("#btnDelete").style.display=id?"block":"none";
  ["category","name","phone","stage","source","company","kw","type","amount","area","addr","rep","followup","special","note"].forEach(f=>{ const el=$("#f_"+f); if(el) el.value=r[f]||""; });
  $("#editBg").classList.add("show");
}
function closeEdit(){ $("#editBg").classList.remove("show"); state.editingId=null; }
function saveEdit(){
  const patch={};
  ["category","name","phone","stage","source","company","kw","type","amount","area","addr","rep","followup","special","note"].forEach(f=>{ patch[f]=$("#f_"+f).value.trim(); });
  if(state.editingId) updateRecord(state.editingId,patch); else addRecord(patch);
  closeEdit(); render(); toast("저장됨");
}
let toastT;
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1800); }

/* events */
document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  tab.classList.add("active"); state.view=tab.dataset.view; state.stageFilter=""; render();
}));
document.querySelectorAll(".cat").forEach(c=>c.addEventListener("click",()=>{
  document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
  c.classList.add("active"); state.category=c.dataset.cat; state.stageFilter=""; render();
}));
$("#chips").addEventListener("click",e=>{ const c=e.target.closest("[data-stage]"); if(!c)return; state.stageFilter=c.dataset.stage; render(); });
$("#quickAdd").addEventListener("click",()=>{
  const v=$("#quickInput").value.trim(); if(!v)return;
  const rec=parseQuick(v); const r=addRecord(rec); $("#quickInput").value=""; if(r.category!==state.category){ state.category=r.category; document.querySelectorAll(".cat").forEach(x=>x.classList.toggle("active",x.dataset.cat===r.category)); } render(); toast(`추가: ${rec.name||"이름없음"} · ${r.category} ${rec.stage}`);
});
$("#quickInput").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#quickAdd").click(); });
["input","change"].forEach(ev=>{ ["#search","#sort","#companyFilter"].forEach(s=>$(s).addEventListener(ev,render)); });
$("#list").addEventListener("click",e=>{
  const ed=e.target.closest("[data-edit]"); if(ed){ openEdit(ed.dataset.edit); return; }
  const al=e.target.closest("[data-alarm]"); if(al){ const r=state.data.find(x=>x.id===al.dataset.alarm); const url=gcalUrl(r); if(url){ window.open(url,"_blank"); toast("캘린더 열림 → 저장 누르면 알림 예약"); } else toast("다음연락일을 먼저 넣어주세요"); return; }
  const ct=e.target.closest("[data-contract]"); if(ct){ updateRecord(ct.dataset.contract,{stage:"계약"}); render(); toast("계약으로 전환"); return; }
  const st=e.target.closest("[data-stage]"); if(st){ const r=state.data.find(x=>x.id===st.dataset.stage); const i=STAGES.indexOf(r.stage); updateRecord(st.dataset.stage,{stage:STAGES[(i+1)%STAGES.length]}); render(); toast("단계: "+state.data.find(x=>x.id===st.dataset.stage).stage); return; }
});
$("#btnSave").addEventListener("click",saveEdit);
$("#btnCancel").addEventListener("click",closeEdit);
$("#btnDelete").addEventListener("click",()=>{ if(state.editingId&&confirm("이 상담을 삭제할까요?")){ deleteRecord(state.editingId); closeEdit(); render(); toast("삭제됨"); } });
$("#editBg").addEventListener("click",e=>{ if(e.target===$("#editBg")) closeEdit(); });

/* menu */
$("#btnMenu").addEventListener("click",()=>$("#menuBg").classList.add("show"));
$("#menuClose").addEventListener("click",()=>$("#menuBg").classList.remove("show"));
$("#menuBg").addEventListener("click",e=>{ if(e.target===$("#menuBg"))$("#menuBg").classList.remove("show"); });
$("#mSync").addEventListener("click",async()=>{ if(!cloud.on){toast("동기화 먼저 연결하세요");return;} toast("새로고침 중…"); try{await cloudPull(); render(); toast("최신으로 갱신됨");}catch(e){toast("실패: "+e.message);} });
$("#mExport").addEventListener("click",()=>{ const blob=new Blob([JSON.stringify(state.data,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="상담DB_백업_"+today()+".json"; a.click(); toast("백업 저장됨"); });
$("#mImport").addEventListener("click",()=>$("#fileImport").click());
$("#fileImport").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{ try{ const arr=JSON.parse(rd.result); if(!Array.isArray(arr))throw 0; const ids=new Set(state.data.map(x=>x.id)); let n=0; arr.forEach(x=>{ if(!x.id||!ids.has(x.id)){ x.id=x.id||uid(); state.data.push(x); n++; } }); saveLocal(); render(); toast(n+"건 병합됨"); }catch(err){ toast("불러오기 실패"); } }; rd.readAsText(f); e.target.value=""; });
$("#mCsv").addEventListener("click",()=>{ const cols=["category","name","phone","stage","source","company","kw","type","amount","area","addr","special","note","followup"]; const head=["구분","이름","연락처","단계","누구디비","계약회사","용량kW","유형","계약금액","평수","주소","특이사항","메모","다음연락일"]; const rows=state.data.map(r=>cols.map(c=>`"${(""+(r[c]||"")).replace(/"/g,'""')}"`).join(",")); const csv="﻿"+head.join(",")+"\n"+rows.join("\n"); const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="상담DB_"+today()+".csv"; a.click(); toast("CSV 저장됨"); });
$("#mReset").addEventListener("click",()=>{ if(confirm("이 기기 화면 목록을 비웁니다. (클라우드 데이터는 남아있고, 다시 동기화하면 내려받습니다) 진행할까요?")){ state.data=[]; saveLocal(); render(); toast("비웠습니다. 동기화하면 내려받습니다"); } });

/* cloud */
$("#btnCloud").addEventListener("click",()=>{ $("#c_url").value=cloud.url||""; $("#c_key").value=cloud.key||""; $("#cloudStatus").textContent=cloud.on?"현재 연결됨 ✓":""; $("#cloudBg").classList.add("show"); });
$("#cloudBg").addEventListener("click",e=>{ if(e.target===$("#cloudBg"))$("#cloudBg").classList.remove("show"); });
$("#cloudOff").addEventListener("click",()=>{ cloud.on=false; saveCloudCfg(); updateCloudDot(); $("#cloudBg").classList.remove("show"); toast("동기화 꺼짐"); });
$("#cloudSave").addEventListener("click",async()=>{
  cloud.url=$("#c_url").value.trim().replace(/\/+$/,"").replace(/\/rest\/v1$/,""); cloud.key=$("#c_key").value.trim();
  if(!cloud.url||!cloud.key){ toast("URL과 Key를 입력하세요"); return; }
  cloud.on=true; saveCloudCfg(); $("#cloudStatus").textContent="연결 시도 중…";
  try{ await cloudPull(); for(const r of state.data){ if(!r.remote_id) await cloudPush(r); } render(); updateCloudDot(); $("#cloudStatus").textContent="연결됨 ✓ 동기화 완료"; toast("클라우드 연결됨"); }
  catch(e){ cloud.on=false; saveCloudCfg(); updateCloudDot(); $("#cloudStatus").textContent="연결 실패: "+e.message; }
});
function updateCloudDot(){ $("#cloudDot").classList.toggle("on",!!cloud.on); }

/* 앱으로 돌아오거나 다시 켤 때마다 자동으로 최신 불러오기 */
let lastSync=0;
async function autoSync(force){
  if(!cloud.on) return;
  const t=Date.now(); if(!force && t-lastSync<8000) return; lastSync=t;
  try{ await cloudPull(); render(); }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) autoSync(); });
window.addEventListener("focus",()=>autoSync());

/* init — 자동 시드 없음(데이터는 클라우드/직접입력) */
function init(){
  loadCloudCfg(); loadLocal(); updateCloudDot();
  if(cloud.on){ autoSync(true); }
  render();
}
init();
</script>
</body>
